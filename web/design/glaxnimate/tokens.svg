<svg xmlns="http://www.w3.org/2000/svg" width="72" height="24" viewBox="0 0 72 24"><title id="tokens-title">Coin heads, coin tails and a damage counter, each on a 24 unit grid</title><g id="coin-heads"><circle id="heads-disc" cx="12" cy="12" r="11" fill="#F2B531" /><circle id="heads-rim" cx="12" cy="12" r="9" fill="none" stroke="#B57F0E" stroke-width="1.2" /><rect id="heads-card-left" x="7.6" y="8.2" width="4" height="5.8" rx="0.6" fill="none" stroke="#6B4A06" stroke-width="1.1" transform="rotate(-5 9.6 11.1)" /><rect id="heads-card-right" x="12.6" y="8.2" width="4" height="5.8" rx="0.6" fill="#6B4A06" transform="rotate(4 14.6 11.1)" /></g><g id="coin-tails" transform="translate(24 0)"><circle id="tails-disc" cx="12" cy="12" r="11" fill="#C9CED9" /><circle id="tails-rim" cx="12" cy="12" r="9" fill="none" stroke="#7D8699" stroke-width="1.2" /><circle id="tails-ring" cx="12" cy="12" r="4.6" fill="none" stroke="#4B5468" stroke-width="1.6" /></g><g id="counter" transform="translate(48 0)"><path id="counter-chip" d="M7 1.5H17L22.5 7V17L17 22.5H7L1.5 17V7Z" fill="#F2683C" stroke="#A8391A" stroke-width="1.2" stroke-linejoin="round" /><path id="counter-shine" d="M7.6 3.4H16.4L20.6 7.6" fill="none" stroke="#FFB59C" stroke-width="1.2" stroke-linecap="round" /></g></svg>
